[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-strategy-backend"
version = "0.1.0"
description = "Local stock-analysis backend"
requires-python = ">=3.12"
dependencies = [
    "APScheduler>=3.11,<3.12",
    "akshare>=1.20,<2.0",
    "alembic>=1.13,<2.0",
    "baostock>=0.9,<1.0",
    "ccxt>=4.4.50,<4.5",
    "croniter>=3.0,<7.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<4.0",
    "pydantic>=2.10,<3.0",
    "pypdf>=5.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "yfinance>=0.2.54,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "respx>=0.21,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "online: public-provider smoke tests requiring STOCK_LAB_ONLINE=1",
]
